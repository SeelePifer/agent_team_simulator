[project]
name = "agent-team-simulator"
version = "0.1.0"
description = "Compare multi-agent coordination strategies on programming tasks."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.0",
  "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
